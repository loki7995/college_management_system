services:
  - type: web
    name: college-management-portal
    runtime: python
    plan: starter
    region: singapore
    repo: https://github.com/loki7995/college_management_system
    branch: main
    buildCommand: bash ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    disk:
      name: student-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: college-management-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"

databases:
  - name: college-management-db
    databaseName: student_management_system
    user: student_management_user
    plan: basic-256mb
    region: singapore
